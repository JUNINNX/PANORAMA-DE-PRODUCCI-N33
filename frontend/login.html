<script>
(() => {
  const preference = localStorage.getItem('panorama_login_theme') || 'auto';
  const hour = new Date().getHours();
  document.documentElement.dataset.loginTheme = preference === 'auto'
    ? (hour >= 18 || hour < 7 ? 'dark' : 'light')
    : preference;
})();
</script>

<title>Acceso · Panorama de Producción</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}

:root{
  --red:#e30613;
  --red2:#ff1724;
  --dark:#030405;
  --panel:rgba(4,5,6,.82);
  --line:rgba(255,24,35,.72);
}

body{
  min-height:100vh;
  padding:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  isolation:isolate;
  font-family:'Poppins',Arial,sans-serif;
  background:#020304;
  color:#fff;
}

/* =====================================================
   FONDO INDUSTRIAL DINÁMICO
   No depende de una imagen externa: todo se anima con CSS.
   ===================================================== */
.background,
.background::before,
.background::after{
  position:fixed;
  inset:-12%;
  pointer-events:none;
}

.background{
  z-index:-5;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 43%, rgba(70,0,4,.35), transparent 28%),
    radial-gradient(circle at 14% 82%, rgba(255,0,20,.22), transparent 23%),
    radial-gradient(circle at 84% 17%, rgba(255,0,20,.20), transparent 25%),
    linear-gradient(135deg,#010202 0%,#090b0d 47%,#020303 100%);
}

.background::before{
  content:"";
  z-index:-4;
  opacity:.75;
  background:
    repeating-linear-gradient(135deg,
      transparent 0 118px,
      rgba(255,255,255,.025) 119px 122px,
      transparent 123px 238px),
    repeating-linear-gradient(135deg,
      transparent 0 155px,
      rgba(255,0,20,.10) 156px 160px,
      transparent 161px 330px);
  animation: backgroundShift 18s linear infinite;
}

.background::after{
  content:"";
  z-index:-3;
  background:
    linear-gradient(115deg,transparent 38%,rgba(255,0,18,.0) 43%,rgba(255,20,35,.28) 45%,rgba(255,20,35,.02) 47%,transparent 52%),
    linear-gradient(295deg,transparent 42%,rgba(255,0,18,.0) 46%,rgba(255,20,35,.20) 48%,rgba(255,20,35,.02) 50%,transparent 55%);
  filter:blur(1px);
  animation:laserMove 7s ease-in-out infinite alternate;
}

.energy{
  position:fixed;
  z-index:-2;
  width:52vw;
  height:52vw;
  max-width:760px;
  max-height:760px;
  min-width:420px;
  min-height:420px;
  border-radius:50%;
  pointer-events:none;
  filter:blur(35px);
  opacity:.20;
  background:radial-gradient(circle,rgba(255,0,18,.65) 0,rgba(255,0,18,.12) 30%,transparent 68%);
  animation:energyFloat 9s ease-in-out infinite;
}

.energy.one{left:-18%;bottom:-24%}
.energy.two{right:-18%;top:-25%;animation-delay:-4.5s;opacity:.17}

.scanline{
  position:fixed;
  z-index:-1;
  left:-20%;
  top:0;
  width:140%;
  height:2px;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,20,30,.75),transparent);
  box-shadow:0 0 20px rgba(255,0,20,.75);
  animation:scan 6s linear infinite;
  opacity:.45;
}

#particles{
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  overflow:hidden;
}

.particle{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:#ff2b37;
  box-shadow:0 0 7px #ff1020,0 0 14px rgba(255,0,20,.5);
  opacity:0;
  animation:particleFloat linear infinite;
}

/* =====================================================
   CONTENEDOR PRINCIPAL
   ===================================================== */
.login-wrap{
  width:min(540px,100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  z-index:2;
}

/* Marca superior, como en la referencia */
.brand-logo{
  text-align:center;
  margin-bottom:24px;
  user-select:none;
  animation:logoReveal .8s ease both;
}

.brand-icon{
  width:128px;
  height:128px;
  object-fit:contain;
  display:block;
  margin:0 auto 4px;
  filter:drop-shadow(0 0 13px rgba(255,0,20,.38));
  animation:logoPulse 4s ease-in-out infinite;
}

.brand-name{
  margin:0;
  color:var(--red);
  font-family:'Oswald',Arial,sans-serif;
  font-size:58px;
  line-height:.92;
  font-weight:700;
  letter-spacing:.025em;
  text-shadow:0 0 18px rgba(255,0,20,.20),0 3px 12px rgba(0,0,0,.9);
}

.brand-sub{
  margin:8px 0 0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  color:#f0f0f0;
  font-family:'Oswald',Arial,sans-serif;
  font-size:26px;
  line-height:1;
  letter-spacing:.14em;
  font-weight:500;
}

.brand-sub::before,
.brand-sub::after{
  content:"";
  width:42px;
  height:3px;
  border-radius:3px;
  background:var(--red);
  box-shadow:0 0 10px rgba(255,0,20,.55);
}

.brand-tagline{
  margin:12px 0 0;
  color:#b8b8b8;
  font-size:14px;
  letter-spacing:.32em;
  font-weight:500;
}

.brand-tagline span{color:var(--red);padding:0 8px}

/* =====================================================
   TARJETA
   ===================================================== */
.card{
  position:relative;
  width:100%;
  padding:34px 42px 26px;
  border-radius:27px;
  background:
    linear-gradient(145deg,rgba(18,18,18,.86),rgba(0,0,0,.91)),
    rgba(0,0,0,.84);
  border:1px solid rgba(255,24,35,.55);
  box-shadow:
    0 0 0 1px rgba(255,0,20,.06) inset,
    0 0 28px rgba(255,0,20,.18),
    0 24px 70px rgba(0,0,0,.72),
    inset 0 0 35px rgba(255,0,20,.035);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  animation:cardReveal .75s cubic-bezier(.2,.75,.25,1) both;
}

/* borde luminoso animado */
.card::before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:28px;
  padding:1px;
  background:linear-gradient(105deg,transparent 0%,rgba(255,0,20,.15) 25%,#ff101f 50%,rgba(255,0,20,.15) 75%,transparent 100%);
  background-size:220% 100%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  animation:borderFlow 4s linear infinite;
}

.card::after{
  content:"";
  position:absolute;
  top:0;
  left:28%;
  right:28%;
  height:2px;
  background:#ff1726;
  box-shadow:0 0 12px #ff0015,0 0 28px rgba(255,0,20,.65);
  border-radius:0 0 4px 4px;
}

.welcome{
  margin:0;
  text-align:center;
  color:#fff;
  font-size:28px;
  line-height:1.15;
  font-weight:700;
  letter-spacing:.02em;
}

.subtitle{
  margin:9px 0 18px;
  text-align:center;
  color:#a8a8a8;
  font-size:15px;
}

.welcome-line{
  width:78px;
  height:3px;
  margin:0 auto 24px;
  border-radius:10px;
  background:var(--red);
  box-shadow:0 0 12px rgba(255,0,20,.75);
  animation:linePulse 2.5s ease-in-out infinite;
}

/* =====================================================
   CAMPOS
   ===================================================== */
.field{
  position:relative;
  margin-bottom:17px;
}

input{
  width:100%;
  height:59px;
  padding:0 52px 0 58px;
  border:1px solid rgba(255,0,20,.82);
  border-radius:13px;
  outline:none;
  background:rgba(0,0,0,.55);
  color:#fff;
  font-family:inherit;
  font-size:16px;
  transition:border-color .2s,box-shadow .2s,background .2s,transform .2s;
  box-shadow:inset 0 0 18px rgba(0,0,0,.55);
}

input::placeholder{color:#8f8f8f}

input:focus{
  border-color:#ff2634;
  background:rgba(5,5,5,.82);
  box-shadow:0 0 0 2px rgba(255,0,20,.12),0 0 20px rgba(255,0,20,.13),inset 0 0 18px rgba(0,0,0,.6);
  transform:translateY(-1px);
}

.field-icon{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  color:#f4f4f4;
  pointer-events:none;
  z-index:1;
}

.user-icon::before{
  content:"";
  width:10px;
  height:10px;
  border:2px solid #f5f5f5;
  border-radius:50%;
  position:absolute;
  top:0;
}
.user-icon::after{
  content:"";
  width:20px;
  height:10px;
  border:2px solid #f5f5f5;
  border-radius:12px 12px 0 0;
  border-bottom:0;
  position:absolute;
  bottom:0;
}

.lock-icon::before{
  content:"";
  position:absolute;
  width:17px;
  height:14px;
  border:2px solid #f5f5f5;
  border-radius:3px;
  bottom:1px;
}
.lock-icon::after{
  content:"";
  position:absolute;
  width:11px;
  height:10px;
  border:2px solid #f5f5f5;
  border-bottom:0;
  border-radius:8px 8px 0 0;
  top:0;
}

.toggle-password{
  position:absolute;
  right:13px;
  top:50%;
  transform:translateY(-50%);
  width:34px;
  height:34px;
  padding:0;
  border:0;
  background:transparent;
  color:#e7e7e7;
  cursor:pointer;
  font-size:0;
}

.toggle-password::before{
  content:"";
  position:absolute;
  left:6px;
  top:9px;
  width:20px;
  height:13px;
  border:2px solid #eee;
  border-radius:50% / 70%;
}
.toggle-password::after{
  content:"";
  position:absolute;
  width:26px;
  height:2px;
  background:#eee;
  left:4px;
  top:16px;
  transform:rotate(-42deg);
  box-shadow:0 0 4px rgba(255,255,255,.3);
}

.toggle-password:hover{filter:drop-shadow(0 0 6px rgba(255,0,20,.8))}

/* =====================================================
   BOTÓN
   ===================================================== */
button.login-button{
  position:relative;
  width:100%;
  height:61px;
  margin-top:7px;
  border:1px solid rgba(255,70,70,.22);
  border-radius:13px;
  overflow:hidden;
  background:linear-gradient(180deg,#f00913 0%,#c90009 52%,#a80007 100%);
  color:#fff;
  font-family:inherit;
  font-size:17px;
  font-weight:800;
  letter-spacing:.02em;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(220,0,15,.25),0 0 15px rgba(255,0,20,.14);
  transition:transform .15s,filter .15s,box-shadow .15s;
}

button.login-button::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:80px;
  left:-100px;
  transform:skewX(-22deg);
  background:rgba(255,255,255,.25);
  animation:buttonShine 3.5s ease-in-out infinite;
}

button.login-button::after{
  content:"→";
  position:absolute;
  right:27px;
  top:50%;
  transform:translateY(-52%);
  font-size:31px;
  line-height:1;
  font-weight:300;
}

button.login-button:hover{
  transform:translateY(-2px);
  filter:brightness(1.07);
  box-shadow:0 12px 28px rgba(220,0,15,.36),0 0 22px rgba(255,0,20,.2);
}
button.login-button:active{transform:translateY(0)}
button.login-button:disabled{opacity:.65;cursor:wait;transform:none}

.error{
  display:none;
  margin-top:13px;
  padding:10px 12px;
  border:1px solid rgba(255,60,60,.35);
  border-radius:9px;
  background:rgba(120,0,0,.25);
  color:#ffb0b0;
  font-size:13px;
  text-align:center;
  animation:errorIn .25s ease both;
}

.footer{
  margin-top:22px;
  text-align:center;
  color:#9b9b9b;
  font-size:13px;
}

/* =====================================================
   ANIMACIONES
   ===================================================== */
@keyframes backgroundShift{
  from{transform:translate3d(-2%,0,0) scale(1.02)}
  to{transform:translate3d(2%,1%,0) scale(1.02)}
}
@keyframes laserMove{
  0%{transform:translateX(-4%) translateY(-2%) scale(1)}
  50%{transform:translateX(2%) translateY(1%) scale(1.03)}
  100%{transform:translateX(-1%) translateY(3%) scale(1.01)}
}
@keyframes energyFloat{
  0%,100%{transform:translate(0,0) scale(1);opacity:.16}
  50%{transform:translate(6vw,-3vh) scale(1.15);opacity:.25}
}
@keyframes scan{
  from{transform:translateY(-20vh) rotate(-2deg)}
  to{transform:translateY(120vh) rotate(-2deg)}
}
@keyframes particleFloat{
  0%{transform:translate3d(0,30px,0) scale(.5);opacity:0}
  12%{opacity:.75}
  50%{opacity:.35}
  100%{transform:translate3d(var(--drift),-105vh,0) scale(1.4);opacity:0}
}
@keyframes logoReveal{
  from{opacity:0;transform:translateY(-18px) scale(.96)}
  to{opacity:1;transform:none}
}
@keyframes logoPulse{
  0%,100%{filter:drop-shadow(0 0 10px rgba(255,0,20,.28))}
  50%{filter:drop-shadow(0 0 20px rgba(255,0,20,.52))}
}
@keyframes cardReveal{
  from{opacity:0;transform:translateY(22px) scale(.985)}
  to{opacity:1;transform:none}
}
@keyframes borderFlow{to{background-position:220% 0}}
@keyframes linePulse{
  0%,100%{box-shadow:0 0 8px rgba(255,0,20,.55);transform:scaleX(1)}
  50%{box-shadow:0 0 18px rgba(255,0,20,.95);transform:scaleX(1.15)}
}
@keyframes buttonShine{
  0%,55%{left:-100px}
  80%,100%{left:115%}
}
@keyframes errorIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* =====================================================
   RESPONSIVE
   ===================================================== */
@media(max-width:700px){
  body{padding:16px;overflow:auto;min-height:100svh}
  .login-wrap{width:min(500px,100%);padding:20px 0}
  .brand-logo{margin-bottom:20px}
  .brand-icon{width:88px;height:88px}
  .brand-name{font-size:43px}
  .brand-sub{font-size:20px;gap:9px}
  .brand-sub::before,.brand-sub::after{width:28px}
  .brand-tagline{font-size:10px;letter-spacing:.23em}
  .card{padding:30px 22px 24px;border-radius:22px}
  .welcome{font-size:25px}
  input{height:56px}
  button.login-button{height:58px}
}

@media(max-width:430px){
  body{padding:10px}
  .login-wrap{padding:8px 0}
  .brand-icon{width:70px;height:70px}
  .brand-name{font-size:35px}
  .brand-sub{font-size:16px;letter-spacing:.10em}
  .brand-tagline{font-size:8px}
  .card{padding:27px 17px 21px}
  .welcome{font-size:23px}
  .subtitle{font-size:13px}
  input{padding-left:54px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
}
</style>
</head>

          <span class="field-icon lock-icon" aria-hidden="true"></span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Contraseña" required>
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">Mostrar contraseña</button>
        </div>

        <button id="loginButton" class="login-button" type="submit">INGRESAR</button>
        <div id="error" class="error"></div>
      </form>

      <div class="footer">Sistema interno · Panorama de Producción</div>
    </section>
  </main>

<script>
/* Mantiene exactamente la lógica de conexión y autenticación del login original. */
const API_BASE = 'https://panorama-de-producci-n33.onrender.com/api';

/* Mostrar / ocultar contraseña */
document
  .getElementById('togglePassword')
  .addEventListener('click', () => {
    const password = document.getElementById('password');
    const toggle = document.getElementById('togglePassword');

    if(password.type === 'password'){
      password.type = 'text';
      toggle.setAttribute('aria-label','Ocultar contraseña');
    }else{
      password.type = 'password';
      toggle.setAttribute('aria-label','Mostrar contraseña');
    }
  });

/* Mantener la sesión si ya existe */
if(sessionStorage.getItem('panorama_access_token')){
  fetch(
    API_BASE + '/auth/me',
    {
      headers:{
        Authorization:
          'Bearer ' +
          sessionStorage.getItem('panorama_access_token')
      }
    }
  )
  .then(response => {
    if(response.ok){
      window.location.replace('menu.html');
    }else{
      sessionStorage.removeItem('panorama_access_token');
    }
  })
  .catch(() => {});
}

/* Login */
document
  .getElementById('loginForm')
  .addEventListener('submit', async (event) => {
    event.preventDefault();

    const button = document.getElementById('loginButton');
    const error = document.getElementById('error');

    error.style.display = 'none';
    button.disabled = true;
    button.textContent = 'INGRESANDO...';

    try{
      const response = await fetch(
        API_BASE + '/auth/login',
        {
          method:'POST',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({
            username:
              document
                .getElementById('username')
                .value
                .trim(),
            password:
              document
                .getElementById('password')
                .value
          })
        }
      );

      const data = await response.json().catch(() => ({}));

      if(!response.ok){
        throw new Error(
          data.message ||
          'Usuario o contraseña incorrectos.'
        );
      }

      sessionStorage.setItem(
        'panorama_access_token',
        data.token
      );

      window.location.replace('menu.html');

    }catch(err){
      error.textContent =
        err.message ||
        'No se pudo conectar con el servidor.';
      error.style.display = 'block';
    }finally{
      button.disabled = false;
      button.textContent = 'INGRESAR';
    }
  });

/* Partículas y pequeñas chispas rojas del fondo */
(function createParticles(){
  const container = document.getElementById('particles');
  const count = Math.min(55, Math.max(25, Math.floor(window.innerWidth / 25)));

  for(let i = 0; i < count; i++){
    const particle = document.createElement('span');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.top = (55 + Math.random() * 55) + '%';
    particle.style.setProperty('--drift', ((Math.random() - .5) * 180) + 'px');
    particle.style.animationDuration = (7 + Math.random() * 11) + 's';
    particle.style.animationDelay = (-Math.random() * 15) + 's';
    particle.style.width = particle.style.height = (Math.random() > .86 ? 3 : 2) + 'px';
    container.appendChild(particle);
  }
})();
</script>
</body>
</html>
