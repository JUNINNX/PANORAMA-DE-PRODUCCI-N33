<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panorama de Producción - La Campana</title>
    <style>
        /* Pantallas de Carga */
        #auth-overlay, #__bundler_thumbnail {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #d5101b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            z-index: 99999;
        }

        #__bundler_thumbnail {
            display: none;
            z-index: 99998;
        }

        /* Botón de SAP personalizado */
        .btn-cargar-sap {
            background-color: #d5101b !important;
            color: #ffffff !important;
            border: none !important;
            padding: 8px 16px !important;
            border-radius: 6px !important;
            font-weight: 700 !important;
            font-size: 0.85rem !important;
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
            transition: background-color 0.2s !important;
            text-transform: UPPERCASE !important;
        }

        .btn-cargar-sap:hover {
            background-color: #b00d16 !important;
        }

        /* Modal para Selección de Fechas SAP */
        .sap-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .sap-modal-content {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            width: 340px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .sap-modal-title {
            margin-top: 0;
            margin-bottom: 16px;
            color: #d5101b;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .sap-field-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sap-field-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
        }

        .sap-field-group input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .sap-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-modal-cancel {
            background: #e0e0e0;
            color: #333;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-modal-confirm {
            background: #d5101b;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Overlays de Carga -->
    <div id="auth-overlay">Comprobando sesión...</div>
    <div id="__bundler_thumbnail">Cargando menú...</div>

    <!-- Modal de Selección de Fechas -->
    <div class="sap-modal-overlay" id="sapDateModal">
        <div class="sap-modal-content">
            <h3 class="sap-modal-title">Consultar Rango en SAP</h3>
            
            <div class="sap-field-group">
                <label for="sapFechaInicio">Fecha de Inicio:</label>
                <input type="date" id="sapFechaInicio">
            </div>

            <div class="sap-field-group">
                <label for="sapFechaFin">Fecha de Fin:</label>
                <input type="date" id="sapFechaFin">
            </div>

            <div class="sap-modal-actions">
                <button class="btn-modal-cancel" id="btnCerrarModalSAP">Cancelar</button>
                <button class="btn-modal-confirm" id="btnBuscarSAP">Consultar</button>
            </div>
        </div>
    </div>

    <!-- Contenedor del Dashboard de La Campana -->
    <div id="app"></div>

    <!-- Script de Autenticación, Inyección de Botón y Modal -->
    <script>
        // 1. Check Auth Session
        (async function checkAuth() {
            const token = sessionStorage.getItem('panorama_access_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Sesión no válida');
                document.getElementById('auth-overlay').style.display = 'none';
            } catch (error) {
                sessionStorage.removeItem('panorama_access_token');
                window.location.href = 'login.html';
            }
        })();

        // Cache Refresh Guard
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) window.location.reload();
        });

        // 2. Control del Modal de Fechas y Conexión SAP
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('sapDateModal');
            const btnCerrar = document.getElementById('btnCerrarModalSAP');
            const btnBuscar = document.getElementById('btnBuscarSAP');

            btnCerrar.addEventListener('click', () => {
                modal.style.display = 'none';
            });

            btnBuscar.addEventListener('click', async () => {
                const fechaInicio = document.getElementById('sapFechaInicio').value;
                const fechaFin = document.getElementById('sapFechaFin').value;

                if (!fechaInicio || !fechaFin) {
                    alert('Por favor seleccione ambas fechas (Inicio y Fin).');
                    return;
                }

                if (fechaInicio > fechaFin) {
                    alert('La fecha de inicio no puede ser posterior a la fecha fin.');
                    return;
                }

                modal.style.display = 'none';
                await ejecutarCargaDesdeSAP(fechaInicio, fechaFin);
            });
        });

        // 3. Sustitución de Botón "CARGAR EXCEL" por "CARGAR DESDE SAP"
        function sustituirBotonExcelPorSAP() {
            const elementos = document.querySelectorAll('button, a, div');
            
            elementos.forEach(el => {
                if (el.textContent && el.textContent.toUpperCase().includes('CARGAR EXCEL')) {
                    const btnSAP = document.createElement('button');
                    btnSAP.className = 'btn-cargar-sap';
                    btnSAP.id = 'btnCargarSAP';
                    btnSAP.innerHTML = '⚡ CARGAR DESDE SAP';

                    btnSAP.addEventListener('click', () => {
                        document.getElementById('sapDateModal').style.display = 'flex';
                    });

                    if (el.parentNode) {
                        el.parentNode.replaceChild(btnSAP, el);
                    }
                }
            });
        }

        // 4. Función base de Consulta a la API de SAP
        async function ejecutarCargaDesdeSAP(fechaInicio, fechaFin) {
            const token = sessionStorage.getItem('panorama_access_token');
            
            // TODO: Cuando tengas el endpoint real de tu backend SAP, colócala aquí:
            const SAP_ENDPOINT = `/api/sap/cargar-datos?fecha_inicio=${fechaInicio}&fecha_fin=${fechaFin}`;

            console.log(`Iniciando sincronización con SAP desde ${fechaInicio} hasta ${fechaFin}...`);

            try {
                /*
                const response = await fetch(SAP_ENDPOINT, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Error al consultar datos en SAP');
                const datosSAP = await response.json();
                
                alert('¡Datos cargados exitosamente desde SAP!');
                window.location.reload();
                */

                alert(`Consulta enviada a SAP:\n• Fecha Inicio: ${fechaInicio}\n• Fecha Fin: ${fechaFin}\n\n(Listo para conectar al endpoint cuando lo tengas).`);

            } catch (error) {
                console.error('Error SAP:', error);
                alert('No se pudo completar la carga desde SAP.');
            }
        }

        // Vigilar el DOM para detectar cuando renderiza el botón original
        const observer = new MutationObserver(() => {
            sustituirBotonExcelPorSAP();
        });
        observer.observe(document.body, { childList: true, subtree: true });
    </script>

    <!-- Payloads del Bundler Original (NO BORRAR PARA MANTENER LA CAMPANA) -->
    <script type="__bundler/manifest">
        { "assets": {} }
    </script>

    <script type="__bundler/template">
        <div class="dashboard-container">
            <h1>Panorama de Producción</h1>
        </div>
    </script>

    <!-- Script Desempaquetador -->
    <script>
        (async function unpackAndRender() {
            try {
                const manifestScript = document.querySelector('script[type="__bundler/manifest"]');
                const templateScript = document.querySelector('script[type="__bundler/template"]');
                if (!manifestScript || !templateScript) return;

                const manifest = JSON.parse(manifestScript.textContent);
                const templateHTML = templateScript.textContent;

                const parser = new DOMParser();
                const doc = parser.parseFromString(templateHTML, 'text/html');
                
                const appContainer = document.getElementById('app');
                if (appContainer) {
                    appContainer.innerHTML = doc.body.innerHTML;
                }

                const scripts = appContainer.querySelectorAll('script');
                for (const oldScript of scripts) {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                }

                if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
                    window.Babel.transformScriptTags();
                }

            } catch (err) {
                console.error('Error procesando el bundler:', err);
            }
        })();
    </script>
</body>
</html>
