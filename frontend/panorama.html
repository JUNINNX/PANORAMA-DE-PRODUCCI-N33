<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panorama de Producción</title>
    <style>
        /* Base y Layout */
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f4f6f9;
        }

        /* Overlay de comprobación inicial */
        #auth-overlay, #__bundler_thumbnail {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #d5101b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.25rem;
            font-weight: 600;
            z-index: 99999;
        }

        #__bundler_thumbnail {
            display: none;
            z-index: 99998;
        }

        /* Header Rojo con Perfil */
        .top-bar {
            background-color: #d5101b;
            height: 60px;
            padding: 0 24px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
        }

        /* Menu Desplegable Perfil */
        .profile-container {
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .profile-trigger {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
        }

        .avatar-circle {
            width: 38px;
            height: 38px;
            background-color: #ffffff;
            color: #d5101b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 180px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-item {
            padding: 12px 20px;
            color: #d5101b;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-item:hover {
            background-color: #f5f5f5;
        }

        .dropdown-divider {
            height: 1px;
            background-color: #eee;
            margin: 0;
        }

        /* Sección de Búsqueda / Acciones SAP */
        .sap-actions-bar {
            background-color: #ffffff;
            padding: 16px 24px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .sap-input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
            width: 250px;
        }

        .btn-sap {
            padding: 8px 16px;
            background-color: #d5101b;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-sap:hover {
            background-color: #b00d16;
        }
    </style>
</head>
<body>

    <!-- Overlays -->
    <div id="auth-overlay">Comprobando sesión...</div>
    <div id="__bundler_thumbnail">Cargando menú...</div>

    <!-- Barra Superior con Perfil de Usuario -->
    <header class="top-bar">
        <div class="profile-container" id="profileContainer">
            <div class="profile-trigger">
                <div class="avatar-circle">A</div>
                <span id="usernameDisplay">admin</span>
                <small>^</small>
            </div>
            
            <div class="dropdown-menu" id="profileDropdown">
                <button class="dropdown-item" id="btnGoMenu">
                    ← Volver al Menú
                </button>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item" id="btnLogout">
                    Cerrar sesión
                </button>
            </div>
        </div>
    </header>

    <!-- Barra de Búsqueda y Acciones para SAP -->
    <section class="sap-actions-bar">
        <input type="text" id="sapSearchInput" class="sap-input" placeholder="Buscar en SAP (ej. Orden, Código)...">
        <button class="btn-sap" id="btnConsultarSAP">Consultar SAP</button>
    </section>

    <!-- Contenedor Principal para Resultados / App -->
    <main id="app">
        <!-- Los datos recibidos de SAP o del bundler se mostrarán aquí -->
    </main>

    <script>
        // 1. Verificación de Autenticación
        (async function checkAuth() {
            const token = sessionStorage.getItem('panorama_access_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Sesión no válida');
                document.getElementById('auth-overlay').style.display = 'none';
            } catch (error) {
                sessionStorage.removeItem('panorama_access_token');
                window.location.href = 'login.html';
            }
        })();

        // Prevent Cache Reload
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) window.location.reload();
        });

        // 2. Control de Interfaz y Menú Desplegable
        document.addEventListener('DOMContentLoaded', () => {
            const profileContainer = document.getElementById('profileContainer');
            const profileDropdown = document.getElementById('profileDropdown');
            const btnGoMenu = document.getElementById('btnGoMenu');
            const btnLogout = document.getElementById('btnLogout');

            // Abrir / Cerrar Dropdown del Perfil
            profileContainer.addEventListener('click', (e) => {
                e.stopPropagation();
                profileDropdown.classList.toggle('show');
            });

            document.addEventListener('click', () => {
                profileDropdown.classList.remove('show');
            });

            // Acción: Volver al Menú
            btnGoMenu.addEventListener('click', () => {
                const thumbnail = document.getElementById('__bundler_thumbnail');
                if (thumbnail) thumbnail.style.display = 'flex';
                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 300);
            });

            // Acción: Cerrar Sesión
            btnLogout.addEventListener('click', () => {
                sessionStorage.removeItem('panorama_access_token');
                sessionStorage.clear();
                window.location.href = 'login.html';
            });

            // 3. ESTRUCTURA LISTA PARA CONEXIÓN A SAP
            const btnConsultarSAP = document.getElementById('btnConsultarSAP');
            btnConsultarSAP.addEventListener('click', async () => {
                const query = document.getElementById('sapSearchInput').value;
                if (!query) {
                    alert('Por favor ingrese un parámetro de búsqueda.');
                    return;
                }

                console.log('Iniciando consulta a SAP con parámetro:', query);
                await consultarSAP(query);
            });
        });

        // Función plantilla para ejecutar llamadas a SAP
        async function consultarSAP(parametro) {
            const token = sessionStorage.getItem('panorama_access_token');
            
            // TODO: Reemplazar '/api/sap/endpoint' con tu ruta real de SAP cuando la tengas
            const SAP_ENDPOINT = '/api/sap/endpoint?query=' + encodeURIComponent(parametro);

            try {
                /*
                const response = await fetch(SAP_ENDPOINT, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Error al obtener datos de SAP');
                const data = await response.json();
                
                // Mostrar datos en el contenedor app
                document.getElementById('app').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                */

                alert(`Consulta enviada para "${parametro}". Cuando tengas la URL de SAP, activa el código dentro de la función consultarSAP().`);

            } catch (error) {
                console.error('Error SAP:', error);
                alert('No se pudo conectar con SAP.');
            }
        }
    </script>

    <!-- Payloads Bundler -->
    <script type="__bundler/manifest">
        { "assets": {} }
    </script>

    <script type="__bundler/template">
        <div class="dashboard-container" style="padding: 24px;">
            <h1>Panorama de Producción</h1>
            <p>Módulo listo para conexión con SAP.</p>
        </div>
    </script>

    <!-- Desempaquetador -->
    <script>
        (async function unpackAndRender() {
            try {
                const manifestScript = document.querySelector('script[type="__bundler/manifest"]');
                const templateScript = document.querySelector('script[type="__bundler/template"]');
                if (!manifestScript || !templateScript) return;

                const templateHTML = templateScript.textContent;
                const parser = new DOMParser();
                const doc = parser.parseFromString(templateHTML, 'text/html');
                
                const appContainer = document.getElementById('app');
                if (appContainer) {
                    appContainer.appendChild(doc.body.firstChild);
                }
            } catch (err) {
                console.error('Error bundler:', err);
            }
        })();
    </script>
</body>
</html>
