<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú · Panorama de Producción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}

:root{
  --red:#e30613;
  --red2:#ff1724;
  --dark:#030405;
  --panel:rgba(4,5,6,.82);
  --line:rgba(255,24,35,.72);
}

body{
  min-height:100vh;
  padding:24px;
  font-family:'Poppins',Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 0%, rgba(70,0,4,.30), transparent 40%),
    linear-gradient(135deg,#010202 0%,#090b0d 47%,#020303 100%);
  color:#fff;
}

/* Comprobando sesión */
#authChecking{
  position:fixed;inset:0;z-index:999999;background:#050506;
  display:flex;align-items:center;justify-content:center;
  font-family:'Poppins',Arial,sans-serif;color:#eaeaea;font-size:15px;letter-spacing:.03em;
}

header.top{
  max-width:1100px;
  margin:0 auto 36px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
}

.brand{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.brand h1{
  margin:0;
  color:var(--red);
  font-family:'Oswald',Arial,sans-serif;
  font-size:30px;
  letter-spacing:.03em;
  text-shadow:0 0 14px rgba(255,0,20,.25);
}

.brand span{
  color:#b8b8b8;
  font-size:12px;
  letter-spacing:.28em;
  text-transform:uppercase;
}

#logoutButton{
  border:0;
  border-radius:10px;
  padding:11px 18px;
  background:#b91c1c;
  color:#fff;
  font:700 14px 'Poppins',system-ui,sans-serif;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
  transition:filter .15s ease;
}
#logoutButton:hover{filter:brightness(.92)}

main{
  max-width:1100px;
  margin:0 auto;
}

.subtitle{
  color:#b8b8b8;
  font-size:15px;
  margin:0 0 28px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:22px;
}

.card{
  position:relative;
  display:block;
  padding:28px 24px;
  border-radius:20px;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(145deg,rgba(18,18,18,.86),rgba(0,0,0,.91));
  border:1px solid rgba(255,24,35,.35);
  box-shadow:0 18px 44px rgba(0,0,0,.55);
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  overflow:hidden;
}

.card:hover{
  transform:translateY(-4px);
  border-color:rgba(255,24,35,.85);
  box-shadow:0 22px 54px rgba(255,0,20,.20), 0 18px 44px rgba(0,0,0,.6);
}

.card .icon{
  width:46px;height:46px;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,0,20,.14);
  margin-bottom:18px;
  font-size:22px;
}

.card h2{
  margin:0 0 8px;
  font-family:'Oswald',Arial,sans-serif;
  font-size:20px;
  letter-spacing:.02em;
}

.card p{
  margin:0;
  color:#a8a8a8;
  font-size:13.5px;
  line-height:1.5;
}

.card.disabled{
  cursor:default;
  opacity:.45;
  pointer-events:none;
}

.card .badge{
  position:absolute;
  top:18px;right:18px;
  font-size:10.5px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#e0a0a0;
  background:rgba(255,0,20,.10);
  border:1px solid rgba(255,24,35,.3);
  padding:4px 9px;
  border-radius:999px;
}

@media(max-width:480px){
  .brand h1{font-size:24px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="authChecking">Comprobando sesión...</div>

<header class="top">
  <div class="brand">
    <h1>PANORAMA</h1>
    <span>Menú principal</span>
  </div>
  <button id="logoutButton" type="button">Cerrar sesión</button>
</header>

<main>
  <p class="subtitle">Selecciona el módulo al que quieres ingresar.</p>

  <div class="grid">
    <a class="card" href="panorama.html">
      <div class="icon">📊</div>
      <h2>Panorama de Producción</h2>
      <p>Consulta el estado y los indicadores de producción.</p>
    </a>

    <a class="card disabled" href="#" tabindex="-1" aria-disabled="true">
      <span class="badge">Próximamente</span>
      <div class="icon">🧾</div>
      <h2>Ventas</h2>
      <p>Gestión de ventas. Módulo en construcción.</p>
    </a>

    <!-- Cuando tengas un nuevo módulo, agrega otra .card aquí -->
  </div>
</main>

<script>
// IMPORTANTE: usa la MISMA URL que configuraste en login.html.
// Si backend y frontend viven en el mismo servidor Express, deja '/api'.
// Si el frontend está en Netlify y el backend en Render, usa la URL completa.
const API_BASE = 'https://TU-BACKEND.onrender.com/api';
const TOKEN_KEY = 'panorama_access_token';

function cerrarSesion(){
  sessionStorage.removeItem(TOKEN_KEY);
  window.location.replace('login.html');
}

document.getElementById('logoutButton').addEventListener('click', cerrarSesion);

async function verificarSesion(){
  const token = sessionStorage.getItem(TOKEN_KEY);
  if(!token){
    window.location.replace('login.html');
    return;
  }
  try{
    const response = await fetch(API_BASE + '/auth/me', {
      headers:{ Authorization: 'Bearer ' + token },
      cache:'no-store'
    });
    if(!response.ok){
      sessionStorage.removeItem(TOKEN_KEY);
      window.location.replace('login.html');
      return;
    }
    document.getElementById('authChecking').remove();
  }catch{
    document.getElementById('authChecking').textContent =
      'No se pudo conectar con el servidor. Verifica tu conexión.';
  }
}

verificarSesion();

// Revalida al volver desde el historial/caché del navegador (ej. tras cerrar sesión y usar "atrás").
window.addEventListener('pageshow', verificarSesion);
</script>

</body>
</html>
